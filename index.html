<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK Products Catalog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        
        .ayuda {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        
        input:focus {
            border-color: #007bff;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls label {
            font-size: 14px;
            color: #555;
        }
        
        select, button {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        .results-info {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .product-sku {
            color: #007bff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .product-description {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .product-stock {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .stock-1 {
            color: #2e7d32;
            background-color: #e8f5e9;
        }
        
        .stock-0 {
            color: #c62828;
            background-color: #ffebee;
        }
        
        .product-photos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .product-photos img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ATK Products Catalog</h1>
        <div class="ayuda">💡 Para ver las fotos de una nueva búsqueda, presiona <strong>F5</strong> o actualiza la página</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por SKU o descripción...">
        </div>
        
        <div class="controls">
            <div>
                <label>📊 Mostrar: </label>
                <select id="filterStock">
                    <option value="all">Todos los productos</option>
                    <option value="available">Solo disponibles ✅</option>
                    <option value="unavailable">Solo no disponibles ❌</option>
                </select>
            </div>
            <div>
                <label>🔄 Ordenar por: </label>
                <select id="sortBy">
                    <option value="sku_asc">SKU (A a Z)</option>
                    <option value="sku_desc">SKU (Z a A)</option>
                </select>
            </div>
            <button id="applyFilters">Aplicar</button>
        </div>
        
        <div id="results" class="results-info"></div>
        <div id="productGrid" class="product-grid"></div>
    </div>

    <script>
    let productos = [];
    let currentSearchTerm = '';
    let currentFilter = 'all';
    let currentSort = 'sku_asc';

    function aString(valor) {
        if (valor === null || valor === undefined) return '';
        return String(valor);
    }

    function cargarFotos(sku, container) {
        container.innerHTML = '<div style="font-size: 12px; color: #999;">⏳ Buscando fotos...</div>';
        
        let fotosUrls = [];
        let peticionesCompletadas = 0;
        let finalizado = false;
        
        function finalizar() {
            if (finalizado) return;
            finalizado = true;
            
            if (fotosUrls.length > 0) {
                let html = '';
                for (let url of fotosUrls) {
                    html += `<img src="${url}" style="width: 80px; height: 80px; object-fit: cover; margin: 5px; border: 1px solid #ddd; border-radius: 4px;">`;
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div style="font-size: 12px; color: #999;">📁 No hay fotos disponibles para ' + sku + '</div>';
            }
        }
        
        for (let i = 1; i <= 9; i++) {
            const numero = i.toString().padStart(2, '0');
            const url = `https://www.atkits.com/assets/images/gallery/OT/${sku}/${sku}_${numero}.png`;
            
            const img = new Image();
            let respondido = false;
            
            const timeoutId = setTimeout(() => {
                if (!respondido) {
                    respondido = true;
                    peticionesCompletadas++;
                    if (peticionesCompletadas === 9) finalizar();
                }
            }, 3000);
            
            img.onload = function() {
                if (!respondido) {
                    respondido = true;
                    clearTimeout(timeoutId);
                    fotosUrls.push(url);
                    peticionesCompletadas++;
                    if (peticionesCompletadas === 9) finalizar();
                }
            };
            
            img.onerror = function() {
                if (!respondido) {
                    respondido = true;
                    clearTimeout(timeoutId);
                    peticionesCompletadas++;
                    if (peticionesCompletadas === 9) finalizar();
                }
            };
            
            img.src = url;
        }
        
        setTimeout(() => {
            finalizar();
        }, 5000);
    }

    function mostrarProductos(productosFiltrados) {
        const grid = document.getElementById('productGrid');
        
        if (!productosFiltrados || productosFiltrados.length === 0) {
            grid.innerHTML = '<div class="no-results">😕 No se encontraron productos</div>';
            document.getElementById('results').innerHTML = '🔍 0 resultados';
            return;
        }
        
        let html = '';
        for (let producto of productosFiltrados) {
            const sku = aString(producto.SKU || producto.sku || producto.Name || '');
            const descripcion = aString(producto.Description || producto.description || '');
            const estaDisponible = producto.Available === 1 || producto.Available === true;
            const idFoto = `fotos-${sku.replace(/[^a-zA-Z0-9]/g, '')}`;
            
            html += `
                <div class="product-card">
                    <div class="product-sku">🔖 SKU: ${sku}</div>
                    <div class="product-description">📝 ${descripcion || 'Sin descripción'}</div>
                    <div class="product-stock stock-${estaDisponible ? 1 : 0}">
                        ${estaDisponible ? '✅ Disponible' : '❌ No disponible'}
                    </div>
                    <div class="product-photos" id="${idFoto}"></div>
                </div>
            `;
        }
        
        grid.innerHTML = html;
        document.getElementById('results').innerHTML = `🔍 Encontrados: ${productosFiltrados.length} productos`;
        
        setTimeout(() => {
            for (let producto of productosFiltrados) {
                const sku = aString(producto.SKU || producto.sku || producto.Name || '');
                const idFoto = `fotos-${sku.replace(/[^a-zA-Z0-9]/g, '')}`;
                const container = document.getElementById(idFoto);
                if (container) {
                    cargarFotos(sku, container);
                }
            }
        }, 50);
    }

    function aplicarFiltrosYOrden(resultados) {
        let procesados = [...resultados];
        
        // Filtrar por stock
        if (currentFilter === 'available') {
            procesados = procesados.filter(p => p.Available === 1 || p.Available === true);
        } else if (currentFilter === 'unavailable') {
            procesados = procesados.filter(p => p.Available === 0 || p.Available === false);
        }
        
        // Ordenar por SKU
        if (currentSort === 'sku_asc') {
            procesados.sort((a, b) => {
                const skuA = aString(a.SKU || a.sku || a.Name || '').toLowerCase();
                const skuB = aString(b.SKU || b.sku || b.Name || '').toLowerCase();
                return skuA.localeCompare(skuB);
            });
        } else if (currentSort === 'sku_desc') {
            procesados.sort((a, b) => {
                const skuA = aString(a.SKU || a.sku || a.Name || '').toLowerCase();
                const skuB = aString(b.SKU || b.sku || b.Name || '').toLowerCase();
                return skuB.localeCompare(skuA);
            });
        }
        
        mostrarProductos(procesados);
    }

    function buscar(termino) {
        currentSearchTerm = termino;
        
        if (termino === '') {
            aplicarFiltrosYOrden(productos);
            return;
        }
        
        if (productos.length === 0) {
            document.getElementById('results').innerHTML = '⏳ Cargando productos...';
            return;
        }
        
        const filtrados = productos.filter(producto => {
            const sku = aString(producto.SKU || producto.sku || producto.Name || '').toLowerCase();
            const descripcion = aString(producto.Description || producto.description || '').toLowerCase();
            return sku.includes(termino) || descripcion.includes(termino);
        });
        
        aplicarFiltrosYOrden(filtrados);
    }

    function cargarYBuscar(termino) {
        if (productos.length > 0) {
            buscar(termino);
            return;
        }
        
        document.getElementById('results').innerHTML = '⏳ Cargando productos por primera vez...';
        
        fetch('datos.json')
            .then(response => response.json())
            .then(data => {
                productos = data;
                document.getElementById('results').innerHTML = `📦 ${productos.length} productos cargados`;
                buscar(termino);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('productGrid').innerHTML = '<div class="no-results">❌ Error cargando datos.json</div>';
            });
    }

    // Event listeners
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterStock');
    const sortSelect = document.getElementById('sortBy');
    const applyBtn = document.getElementById('applyFilters');
    
    let timeoutId = null;

    if (searchInput) {
        searchInput.addEventListener('input', function(e) {
            const termino = e.target.value.toLowerCase().trim();
            
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                cargarYBuscar(termino);
            }, 500);
        });
    }
    
    if (applyBtn) {
        applyBtn.addEventListener('click', function() {
            currentFilter = filterSelect.value;
            currentSort = sortSelect.value;
            buscar(currentSearchTerm);
        });
    }
    </script>
</body>
</html>
