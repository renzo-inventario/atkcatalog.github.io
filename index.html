<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK Products Catalog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; color: #333; }
        .ayuda { text-align: center; color: #888; font-size: 14px; margin-bottom: 20px; font-style: italic; }
        .search-box { margin-bottom: 20px; }
        input { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        input:focus { border-color: #007bff; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .controls label { font-size: 14px; color: #555; }
        select, button { padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; }
        button { background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        .results-info { margin-bottom: 20px; color: #666; font-size: 14px; }
        .search-terms { background-color: #e8f0fe; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #1a73e8; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-sku { color: #007bff; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .product-description { font-size: 16px; margin-bottom: 10px; color: #333; }
        .product-stock { font-size: 14px; font-weight: bold; margin-bottom: 15px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .stock-1 { color: #2e7d32; background-color: #e8f5e9; }
        .stock-0 { color: #c62828; background-color: #ffebee; }
        .product-photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .product-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; }
        .product-photos img:hover { opacity: 0.8; transform: scale(1.05); transition: all 0.2s; }
        .no-results { text-align: center; padding: 50px; color: #666; font-size: 18px; }
        @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } .controls { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ATK Products Catalog</h1>
        <div class="ayuda">💡 Para ver las fotos de una nueva búsqueda, presiona <strong>F5</strong> o actualiza la página.<br>🔎 Puedes buscar múltiples palabras separadas por espacios (ej: "overhaul bmw")<br>🖱️ Haz clic en las fotos para verlas en tamaño completo</div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar por SKU o descripción... (Enter para ver todos)"></div>
        <div id="searchTermsDisplay" class="search-terms" style="display: none;"></div>
        <div class="controls">
            <div><label>📊 Mostrar: </label><select id="filterStock"><option value="all">Todos los productos</option><option value="available">Solo disponibles ✅</option><option value="unavailable">Solo no disponibles ❌</option></select></div>
            <div><label>🔄 Ordenar por: </label><select id="sortBy"><option value="sku_asc">SKU (A a Z)</option><option value="sku_desc">SKU (Z a A)</option></select></div>
            <button id="applyFilters">Aplicar</button>
        </div>
        <div id="results" class="results-info"></div>
        <div id="productGrid" class="product-grid"></div>
    </div>
    <script>
    let productos = [];
    let currentSearchTerm = '';
    let currentFilter = 'all';
    let currentSort = 'sku_asc';

    function aString(v) { return (v === null || v === undefined) ? '' : String(v); }

    function cargarFotos(sku, contenedor) {
        contenedor.innerHTML = '<div style="font-size:12px;color:#999;">⏳ Buscando fotos...</div>';
        
        let fotosEncontradas = [];
        let totalFotos = 9;
        let fotosCargadas = 0;
        
        for (let i = 1; i <= totalFotos; i++) {
            const numero = i.toString().padStart(2, '0');
            const url = `https://www.atkits.com/assets/images/gallery/OT/${sku}/${sku}_${numero}.png`;
            
            const img = new Image();
            const index = i;
            let respondido = false;
            
            const timeoutId = setTimeout(() => {
                if (!respondido) {
                    respondido = true;
                    fotosCargadas++;
                    if (fotosCargadas === totalFotos) mostrarGaleria();
                }
            }, 3000);
            
            img.onload = () => {
                if (!respondido) {
                    respondido = true;
                    clearTimeout(timeoutId);
                    fotosEncontradas[index] = url;
                    fotosCargadas++;
                    if (fotosCargadas === totalFotos) mostrarGaleria();
                }
            };
            
            img.onerror = () => {
                if (!respondido) {
                    respondido = true;
                    clearTimeout(timeoutId);
                    fotosCargadas++;
                    if (fotosCargadas === totalFotos) mostrarGaleria();
                }
            };
            
            img.src = url;
        }
        
        function mostrarGaleria() {
            let html = '';
            let hayFotos = false;
            
            for (let i = 1; i <= totalFotos; i++) {
                if (fotosEncontradas[i]) {
                    hayFotos = true;
                    const url = fotosEncontradas[i];
                    html += `<a href="${url}" target="_blank" style="text-decoration: none;"><img src="${url}" style="width:80px;height:80px;object-fit:cover;margin:5px;border:1px solid #ddd;border-radius:4px;cursor:pointer;"></a>`;
                }
            }
            
            if (hayFotos) {
                contenedor.innerHTML = html;
            } else {
                contenedor.innerHTML = `<div style="font-size:12px;color:#999;">📁 Sin fotos para ${sku}</div>`;
            }
        }
    }

    // Función para filtrar productos según la selección del usuario
    function filtrarPorDisponibilidad(productosFiltrados) {
        if (currentFilter === 'available') {
            return productosFiltrados.filter(p => p.Available === 1 || p.Available === true);
        } else if (currentFilter === 'unavailable') {
            return productosFiltrados.filter(p => p.Available === 0 || p.Available === false);
        } else {
            return productosFiltrados; // 'all' - todos
        }
    }

    function ordenarProductos(productosFiltrados) {
        const productosOrdenados = [...productosFiltrados];
        if (currentSort === 'sku_asc') {
            productosOrdenados.sort((a, b) => aString(a.SKU || a.sku || a.Name).localeCompare(aString(b.SKU || b.sku || b.Name)));
        } else if (currentSort === 'sku_desc') {
            productosOrdenados.sort((a, b) => aString(b.SKU || b.sku || b.Name).localeCompare(aString(a.SKU || a.sku || a.Name)));
        }
        return productosOrdenados;
    }

    function mostrarResultados(productosFiltrados, palabras = null) {
        const grid = document.getElementById('productGrid');
        const termsDiv = document.getElementById('searchTermsDisplay');
        
        // Primero ordenar
        let productosProcesados = ordenarProductos(productosFiltrados);
        
        // Luego mostrar
        if (!productosProcesados || !productosProcesados.length) {
            grid.innerHTML = '<div class="no-results">😕 No se encontraron productos</div>';
            document.getElementById('results').innerHTML = '🔍 0 resultados';
            if (termsDiv) termsDiv.style.display = 'none';
            return;
        }
        
        if (palabras && palabras.length) {
            termsDiv.style.display = 'block';
            termsDiv.innerHTML = `🔎 Buscando: <strong>${palabras.join(' + ')}</strong>`;
        } else termsDiv.style.display = 'none';
        
        let html = '';
        for (const p of productosProcesados) {
            const sku = aString(p.SKU || p.sku || p.Name);
            const desc = aString(p.Description || p.description);
            const disponible = (p.Available === 1 || p.Available === true);
            const idFoto = `fotos-${sku.replace(/[^a-zA-Z0-9]/g, '')}`;
            html += `<div class="product-card"><div class="product-sku">🔖 SKU: ${sku}</div><div class="product-description">📝 ${desc || 'Sin descripción'}</div><div class="product-stock stock-${disponible?1:0}">${disponible?'✅ Disponible':'❌ No disponible'}</div><div class="product-photos" id="${idFoto}"></div></div>`;
        }
        grid.innerHTML = html;
        document.getElementById('results').innerHTML = `🔍 Encontrados: ${productosProcesados.length} productos`;
        
        setTimeout(() => {
            for (const p of productosProcesados) {
                const sku = aString(p.SKU || p.sku || p.Name);
                const id = `fotos-${sku.replace(/[^a-zA-Z0-9]/g, '')}`;
                const c = document.getElementById(id);
                if (c) cargarFotos(sku, c);
            }
        }, 50);
    }

    function aplicarFiltrosYOrden(resultadosBusqueda, palabras = null) {
        // Aplicar filtro de disponibilidad
        const productosConFiltro = filtrarPorDisponibilidad(resultadosBusqueda);
        // Ya se ordenarán dentro de mostrarResultados
        mostrarResultados(productosConFiltro, palabras);
    }

    function buscar(termino) {
        currentSearchTerm = termino;
        
        if (!termino) {
            // Mostrar todos los productos (con filtros y orden aplicados)
            aplicarFiltrosYOrden(productos);
            return;
        }
        
        if (!productos.length) {
            document.getElementById('results').innerHTML = '⏳ Cargando productos...';
            return;
        }
        
        const palabras = termino.toLowerCase().split(/\s+/).filter(w => w.length);
        const filtradosPorBusqueda = productos.filter(p => {
            const sku = aString(p.SKU || p.sku || p.Name).toLowerCase();
            const desc = aString(p.Description || p.description).toLowerCase();
            const texto = sku + ' ' + desc;
            return palabras.every(w => texto.includes(w));
        });
        
        // Aplicar filtros de disponibilidad y orden a los resultados de la búsqueda
        aplicarFiltrosYOrden(filtradosPorBusqueda, palabras);
    }

    function cargarYBuscar(termino) {
        if (productos.length) {
            buscar(termino);
            return;
        }
        
        document.getElementById('results').innerHTML = '⏳ Cargando productos...';
        fetch('datos.json')
            .then(r => r.json())
            .then(d => { 
                productos = d; 
                document.getElementById('results').innerHTML = `📦 ${productos.length} productos cargados`; 
                buscar(termino);
            })
            .catch(e => { 
                console.error(e); 
                document.getElementById('productGrid').innerHTML = '<div class="no-results">❌ Error cargando datos.json</div>';
            });
    }

    const input = document.getElementById('searchInput');
    const filtroSelect = document.getElementById('filterStock');
    const ordenSelect = document.getElementById('sortBy');
    const botonAplicar = document.getElementById('applyFilters');
    let timer = null;

    if (input) {
        input.addEventListener('input', e => {
            const term = e.target.value.toLowerCase().trim();
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => cargarYBuscar(term), 200);
        });
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.target.value.trim()) {
                e.preventDefault();
                if (productos.length) {
                    currentSearchTerm = '';
                    buscar('');
                } else {
                    cargarYBuscar('');
                }
            }
        });
    }
    
    if (botonAplicar) {
        botonAplicar.addEventListener('click', () => {
            currentFilter = filtroSelect.value;
            currentSort = ordenSelect.value;
            // Re-ejecutar la búsqueda actual con los nuevos filtros
            if (currentSearchTerm === undefined || currentSearchTerm === '') {
                aplicarFiltrosYOrden(productos);
            } else {
                buscar(currentSearchTerm);
            }
        });
    }
    </script>
</body>
</html>
